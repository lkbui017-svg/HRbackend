spring.application.name=hr-management-backend
server.port=8080

# Database configuration: default to H2 for local development; override with DB_URL/DB_DRIVER for MySQL/PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:hrdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT
jwt.secret=${JWT_SECRET:HRManagementSystemSecretKeyForJWTAuthentication2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
